name: CI

on:
  push:
    branches: [ feature/marketdata-fallback ]
  pull_request:
    branches: [ feature/marketdata-fallback ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Fast integration (mock)
        env:
          CTS_UPSTOX_MOCK: '1'
          MARKETDATA_DISABLE_SNAPSHOTS: '1'
        run: node backend/strategy/optimizer.cjs --symbols AAPL,MSFT,GOOG --from 2025-10-01 --to 2025-10-03 --interval day --mode upstox --grid "ema_short:8,13;ema_long:55,89;atr_mult:1.2,1.5;volumeFactor:0.9,1.0" --parallel 2 --timeout 20 --out backend/jobs/ci_report.json --csv backend/jobs/ci_top.csv