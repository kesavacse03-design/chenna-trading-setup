apiVersion: batch/v1
kind: Job
metadata:
  name: cts-run-worker-canary-secret
spec:
  template:
    metadata:
      labels:
        app: cts-run-worker
    spec:
      restartPolicy: Never
      containers:
        - name: run-worker
          image: cts-run-worker:latest
          command:
            [
              "/bin/bash",
              "/app/backend/strategy/docker/entrypoint.sh",
              "/run/payload.json",
            ]
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: run-payload
              mountPath: /run
              readOnly: true
      volumes:
        - name: run-payload
          secret:
            secretName: run-worker-payload-secret
  backoffLimit: 1
