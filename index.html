<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Chenna Trading System</title>
    <script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes fade-in-down {
    0% {
      opacity: 0;
      transform: translateY(-10px);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in-down {
    animation: fade-in-down 0.5s ease-out forwards;
  }
  @keyframes highlight-fade {
    0% { background-color: rgba(34, 211, 238, 0.2); } /* bg-cyan-400/20 */
    100% { background-color: transparent; }
  }
  .animate-highlight {
    animation: highlight-fade 1.5s ease-out forwards;
  }
  @keyframes pulse-glow {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7);
    }
    50% {
        transform: scale(1.02);
        box-shadow: 0 0 10px 5px rgba(22, 163, 74, 0), 0 0 20px 10px rgba(34, 197, 94, 0.4);
    }
  }
  .animate-pulse-glow {
      animation: pulse-glow 2.5s infinite;
  }

  @keyframes price-flash-up {
    0% { background-color: rgba(74, 222, 128, 0.3); } /* bg-green-400/30 */
    100% { background-color: transparent; }
  }
  .animate-price-up {
      animation: price-flash-up 1s ease-out;
  }

  @keyframes price-flash-down {
      0% { background-color: rgba(248, 113, 113, 0.3); } /* bg-red-400/30 */
      100% { background-color: transparent; }
  }
  .animate-price-down {
      animation: price-flash-down 1s ease-out;
  }
  
  .neon-text {
    text-shadow:
      0 0 5px rgba(0, 255, 255, 0.6),
      0 0 10px rgba(0, 255, 255, 0.6),
      0 0 20px rgba(0, 255, 255, 0.6),
      0 0 40px rgba(7, 98, 234, 0.4),
      0 0 80px rgba(7, 98, 234, 0.4),
      0 0 90px rgba(7, 98, 234, 0.4),
      0 0 100px rgba(7, 98, 234, 0.4),
      0 0 150px rgba(7, 98, 234, 0.4);
    animation: neon-flicker 3s infinite alternate;
  }

  @keyframes neon-flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% {
      text-shadow:
        0 0 4px rgba(0, 255, 255, 0.5),
        0 0 11px rgba(0, 255, 255, 0.5),
        0 0 19px rgba(0, 255, 255, 0.5),
        0 0 40px rgba(7, 98, 234, 0.3),
        0 0 80px rgba(7, 98, 234, 0.3),
        0 0 90px rgba(7, 98, 234, 0.3),
        0 0 100px rgba(7, 98, 234, 0.3),
        0 0 140px rgba(7, 98, 234, 0.3);
    }
    20%, 24%, 55% {        
      text-shadow: none;
    }
  }

  /* For Notification Bar */
  .notification-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    transition: all 0.5s ease-in-out;
  }
</style>

{

  }
}
</script>
