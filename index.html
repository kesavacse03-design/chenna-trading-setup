  <!-- Tailwind now built locally via PostCSS; CDN removed for speed and reliability -->
    <script>
      // Optional: set an explicit backend base only when you actually have it running.
      // Leaving this unset enables Preview Mode (mock data) so the UI loads instantly.
      // Example to enable live mode locally:
      //   window.__CTS_API_BASE = 'http://127.0.0.1:3001';
      // or if you port-forward the k8s service:
      //   window.__CTS_API_BASE = 'http://127.0.0.1:18080';
  // Enable live backend mode locally for watchlist debugging.
  // Set explicit API base so frontend uses real stocks endpoints.
  window.__CTS_API_BASE = 'http://127.0.0.1:3001';

      // Lightweight fetch logger for automated evidence capture
      (function(){
        try {
          if (!window.__networkLog) window.__networkLog = [];
          const origFetch = window.fetch.bind(window);
          window.fetch = async function(input, init){
            const url = (typeof input === 'string') ? input : (input && input.url) || String(input);
            const method = (init && init.method) || (typeof input === 'object' && input && input.method) || 'GET';
            const started = Date.now();
            try {
              const res = await origFetch(input, init);
              const elapsed = Date.now() - started;
              let bodyPreview = null;
              try {
                if (res && res.clone) {
                  const clone = res.clone();
                  const text = await clone.text();
                  bodyPreview = text.slice(0, 2000);
                }
              } catch(_){}
              window.__networkLog.push({ t: new Date().toISOString(), url, method, status: res.status, ms: elapsed, body: bodyPreview });
              return res;
            } catch (e) {
              const elapsed = Date.now() - started;
              window.__networkLog.push({ t: new Date().toISOString(), url, method, error: String(e && e.message || e), ms: elapsed });
              throw e;
            }
          };
        } catch(_){}
      })();
    </script>
<style>

    0% {
