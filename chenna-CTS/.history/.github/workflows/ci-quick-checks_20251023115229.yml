name: CI Quick Checks

on:
  push:
    branches: [main, dev-for-integration]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PowerShell
        uses: PowerShell/PowerShell@v1

      - name: Run CI Validator
        run: pwsh -File .agent/agents/ci-validator-agent.ps1

