<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-label="CTS Health Flow Template">
  <style>
    .title{font: 700 16px sans-serif; fill: #e2e8f0}
    .label{font: 600 12px sans-serif; fill: #cbd5e1}
    .node{fill:#0f172a;stroke:#475569;stroke-width:1.2}
    .ok{fill:#10b981}
    .warn{fill:#f59e0b}
    .err{fill:#ef4444}
    .hint{font: 12px sans-serif; fill:#94a3b8}
  </style>
  <rect width="100%" height="100%" fill="#020617"/>
  <text x="20" y="30" class="title">Chenna Trading System — Health Flow (Template)</text>

  <!-- Stages -->
  <g transform="translate(40,70)">
    <rect class="node" x="0" y="0" rx="8" ry="8" width="160" height="60"/>
    <circle cx="16" cy="16" r="6" class="ok"/>
    <text x="30" y="20" class="label">UI / Frontend</text>
    <text x="16" y="40" class="hint">frontend_reachable</text>
  </g>

  <g transform="translate(220,70)">
    <rect class="node" x="0" y="0" rx="8" ry="8" width="170" height="60"/>
    <circle cx="16" cy="16" r="6" class="ok"/>
    <text x="30" y="20" class="label">CTS Backend</text>
    <text x="16" y="40" class="hint">backend_alive</text>
  </g>

  <g transform="translate(420,70)">
    <rect class="node" x="0" y="0" rx="8" ry="8" width="210" height="60"/>
    <circle cx="16" cy="16" r="6" class="warn"/>
    <text x="30" y="20" class="label">Market Data / API</text>
    <text x="16" y="40" class="hint">stocks_endpoint, upstox_auth</text>
  </g>

  <g transform="translate(660,70)">
    <rect class="node" x="0" y="0" rx="8" ry="8" width="220" height="60"/>
    <circle cx="16" cy="16" r="6" class="warn"/>
    <text x="30" y="20" class="label">Data &amp; Storage</text>
    <text x="16" y="40" class="hint">db, ohlc_coverage, last_job_json</text>
  </g>

  <g transform="translate(220,160)">
    <rect class="node" x="0" y="0" rx="8" ry="8" width="160" height="60"/>
    <circle cx="16" cy="16" r="6" class="ok"/>
    <text x="30" y="20" class="label">Optimizer</text>
    <text x="16" y="40" class="hint">optimizer_binary</text>
  </g>

  <g transform="translate(420,160)">
    <rect class="node" x="0" y="0" rx="8" ry="8" width="190" height="60"/>
    <circle cx="16" cy="16" r="6" class="ok"/>
    <text x="30" y="20" class="label">Replay / Worker</text>
    <text x="16" y="40" class="hint">replay_running</text>
  </g>

  <g transform="translate(640,160)">
    <rect class="node" x="0" y="0" rx="8" ry="8" width="210" height="60"/>
    <circle cx="16" cy="16" r="6" class="ok"/>
    <text x="30" y="20" class="label">Dashboard Capture</text>
    <text x="16" y="40" class="hint">puppeteer_capture</text>
  </g>

  <!-- Simple connectors -->
  <g stroke="#475569" stroke-width="1.2" fill="none">
    <path d="M200,100 L220,100"/>
    <path d="M390,100 L420,100"/>
    <path d="M630,100 L660,100"/>
  </g>
</svg>
